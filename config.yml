# Shared configuration for the integrated real-data and effects pipeline.
data_root: /media/airlab/870EVOPT2/meed/LEMON/vetted
output_root: /media/airlab/870EVOPT2/meed/LEMON/results/results-meed-validation-30
meta_json: metamaps_export_lemon.json
metadata_csv: ""
preclustering_exclude_ids: ""

input_layout: auto
interleaved_block_seconds: 60.0
interleaved_n_blocks: 16
interleaved_first_condition: EC
fif_glob: "**/*.fif"
subject_regex: "(?i)(sub-[A-Za-z0-9]+)"
condition_regex: "(?i)(?:^|[^A-Za-z0-9])(EC|EO)(?:[^A-Za-z0-9]|$)"
require_both_conditions: true
max_subjects: 0  # full cohort
sfreq_expected: 250.0
sfreq_tolerance: 0.01
ram_monitor_interval_seconds: 10.0
random_seed: 20260827
overwrite: false

a_cache:
  n_jobs_recordings: 1
  n_jobs_fits: 1
  n_jobs_clustering: 17
  k_min: 1
  k_max: 12
  n_init: 100
  max_iter: 300
  tol: 1.0e-6
  min_peak_distance: 1
  criteria_corr_threshold: 0.5
  criteria_min_k: 4
  criteria_max_maps: 2500
  criteria_max_pairs: 200000

b_descriptive:
  n_jobs_recordings: 12
  base_k: 4
  map_k_min: 4
  map_k_max: 8
  time_start_s: 0.0
  time_end_s: 3600.0
  write_exemplary_plots: false
  write_subject_outputs: true
  write_group_outputs: true

c_group_level:
  k_min: 1
  k_max: 15
  n_init: 200
  max_iter: 300
  tol: 1.0e-6
  n_jobs_clustering: 3
  selected_k: 5
  criteria_corr_threshold: 0.5
  criteria_min_k: 4
  criteria_max_maps: 5000
  criteria_max_pairs: 300000

d_backfit:
  n_jobs_recordings: 12
  block_seconds: 60.0
  expected_blocks_per_condition: 8
  annotation_boundary_regex: "(?i)(boundary|block|segment|break|new.*segment)"
  chunk_samples: 250000

e_evaluation:
  n_jobs_recordings: 12
  corr_threshold: 0.5
  rho2_threshold: 0.5
  min_segment_samples: 6
  transition_max_gap_samples: 5
  transition_permutations: 10000
  transition_permutation_seed: 20260829
  max_unassigned_fraction: 0.45
  young_max_age: 35.0
  older_min_age: 59.0
  bootstrap_iterations: 2000
  bootstrap_seed: 20260828
